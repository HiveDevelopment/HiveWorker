name: Release HiveWorker

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Build Linux AMD64
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X hivepanel-worker/internal/version.Version=$VERSION" \
            -o dist/hiveworker_linux_amd64 \
            ./cmd/daemon

      - name: Build Linux ARM64
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags "-s -w -X hivepanel-worker/internal/version.Version=$VERSION" \
            -o dist/hiveworker_linux_arm64 \
            ./cmd/daemon

      - name: Make binaries executable
        run: |
          chmod +x dist/hiveworker_linux_amd64
          chmod +x dist/hiveworker_linux_arm64

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum \
            hiveworker_linux_amd64 \
            hiveworker_linux_arm64 \
            > checksums.txt

          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/hiveworker_linux_amd64
            dist/hiveworker_linux_arm64
            dist/checksums.txt